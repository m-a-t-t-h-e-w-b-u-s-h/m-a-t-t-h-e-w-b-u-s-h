# Wishlista + reguły klasyfikacji.
#
# Składnia słów kluczowych (dopasowanie bez polskich znaków i bez wielkości liter):
#   "karabin*"  – prefiks (karabinek, karabinki, karabinów…)
#   "lite wire" – fraza dokładna (granice słów)
#
# Punktacja: trafienie w nazwie = 3 pkt, w kontekście (breadcrumbs / tytuł listingu) = 2,
# w opisie/specyfikacji = 1, pasująca marka = +1, param_range spełniony = +3.
# `exclude` sprawdzane jest tylko w nazwie produktu – trafienie dyskwalifikuje regułę.
#
# Pola podkategorii:
#   keywords, exclude, brands, require_brand (true = marka musi być z listy `brands`)
#   require_name  – true: słowo kluczowe musi być w nazwie (sam tytuł listingu nie wystarczy)
#   params        – parametry wypisywane w CLI
#   wanted        – false: kubełek klasyfikacyjny, ukryty w wynikach, chyba że zapytasz o niego wprost
#   season, temp  – na stałe przypisany sezon i zakres temperatur [min, max] °C
#   height_fit    – spiwor | karimata: dopasowanie długości do settings.height_cm
#   size          – rozmiar sprawdzany na dostępnych wariantach: {min, max} (EU, buty)
#                   albo {labels: [M, L]} (odzież)
#   filters       – filtry liczbowe na parametrach, np. {pojemnosc_l: {min: 33}}
#   param_range   – klasyfikacja po parametrze, np. {temp_komfortu_c: {max: -5}}
#   shops         – ograniczenie do sklepów
#   alert_below   – próg alertu na Telegram (cena efektywna, zł)
# Pola kategorii: keywords, exclude, exclude_brands, fallback (nazwa podkategorii,
# do której trafiają produkty bez żadnego dopasowania zamiast do `unknown`).
# Kategoria bez `keywords` (np. pozostale) dopasowuje się przez swoje podkategorie.

settings:
  # Płeć produktów w wynikach, --deals i alertach: meskie (= męskie + unisex) | damskie | dzieciece | wszystkie.
  # Jednorazowo nadpiszesz to w CLI: --plec damskie
  gender: meskie
  # Wzrost: śpiwory/karimaty za krótkie (Short, maks. wzrost < 180 cm) są ukrywane i nie wysyłają alertów
  height_cm: 180
  # Gdzie szukać plików z bookmarkletu (gearwatch-*.json) i zapisanych stron (*.html)
  inbox:
    - ~/Downloads
    - ./inbox
  stale_days: 30          # starsze ceny nie są pokazywane domyślnie
  category_margin: 2      # o ile punktów zwycięska kategoria musi wyprzedzić drugą
  subcategory_margin: 2   # j.w. dla podkategorii

shops:
  skalnik:
    hosts: [skalnik.pl, www.skalnik.pl]
    catalog_factor: 0.7   # cena efektywna = min(aktualna, katalogowa * 0.7)
  8a:
    hosts: [8a.pl, www.8a.pl]
    catalog_factor: null  # cena efektywna = aktualna

categories:

  karabinki:
    keywords: [karabin*, carabiner*]
    exclude: [quickdraw*, zestaw ekspres*, sprzetow*, akcesori*]
    fallback: inne
    subcategories:
      ekspresowe:
        # sport, lite wire
        # sport: lite wire + pełne zamki proste/gięte (SG = straight gate, BG = bent gate)
        keywords: [lite wire, litewire, hotwire, sport*, wire sport, straight gate, bent gate, solid gate,
                   sg, bg, straight, bent, prosty, giety, pure, spirit, djinn, orbit, hawk, lime s, lime b]
        exclude: [lock, screw*, zakrec*, hms, sgl, tgl, bgl, 2lock, 3lock, tg, twin gate, tri, safe, slider]
        brands: [Black Diamond, Petzl, DMM, Climbing Technology, Camp, Edelrid, Wild Country]
        params: [waga_g, wytrzymalosc_kn]
        alert_below: 30
      hms:
        keywords: [hms, zakrec*, screwgate, screw gate, screw, twistlock, twist lock, triact, ball lock, auto lock, autolock, automat*, magnetron, lock, rocklock, gridlock, pearlock, triple, triplex, belay, attache, twist,
                   sgl, tgl, bgl, 2lock, 3lock, tg, twin gate, tri, safe, slider]
        params: [waga_g, typ_zamka]
        wanted: false
      gorskie:
        # zwykłe (bez zamka) do ekspresów do wspinania górskiego
        keywords: [nano, oz, micro*, mini*, miniwire, ultralight, alpin*, gorsk*, ange, helium, phantom, wire, wg,
                   wiregate, wire gate, wildwire, nineteen g, fly-weight, flyweight, lime w]
        exclude: [lite wire, litewire, hotwire, lock, screw*, zakrec*, hms, sgl, tgl, bgl, 2lock, 3lock, tg, twin gate]
        params: [waga_g]
      inne:
        # owale, sprzętowe itp. – bez dopasowania do powyższych; ukryte w wynikach
        keywords: []
        params: [waga_g]
        wanted: false

  kosci_mechaniki:
    keywords: [kosc*, stoper*, nut, nuts, offset*, friend*, kam, kamy, kamow, cam, cams, camalot*, mikrokam*, mechanik*]
    exclude: [klucz*, nut key, nut tool, key]
    subcategories:
      kosci:
        keywords: [kosc*, stoper*, nut, nuts, offset*, stopper*, wallnut*, rock*]
        exclude: [mechaniczn*, friend*, cam, cams, camalot*, kam, kamy]
        params: [rozmiary, waga_g]
      friendy:
        keywords: [friend*, kam, kamy, cam, cams, camalot*, c4, dragon*, totem*, ultralight]
        exclude: [mikro*, micro*, z4, c3, x4, zero friend*, zero, dragonfly]
        params: [rozmiar, zakres_mm, waga_g]
      mikrokamy:
        keywords: [mikrokam*, mikro*, micro*, z4, c3, x4, zero friend*, zero, dragonfly]
        params: [rozmiar, waga_g]

  ekspresy:
    keywords: [ekspres*, quickdraw*]
    exclude: [karabinek, ekspres do kawy, kawa*, tasm*]
    fallback: inne
    subcategories:
      sportowe:
        # pełne zamki (keylock/KS, proste/gięte) – modele z listingu Skalnika
        keywords: [sport*, hotforge, sportiva, bulldog, freino, mystic, djinn, spirit, session, orbit, photon, lime,
                   hawk, keylock, ks, str/bnt, bent, steel, axess]
        exclude: [wire*, hotwire, litewire, wildwire, wildhybrid, alpin*, alpine, dyneema]
        params: [dlugosc_cm, waga_g]
      gorskie:
        # zamki drutowe / alpinistyczne
        keywords: [alpin*, alpine, gorsk*, trad, oz, nano, helium, ange, dyneema, ultralight, ultra light,
                   wire*, hotwire, litewire, wildwire, wildhybrid]
        params: [dlugosc_cm, waga_g]
        alert_below: 70
      inne:
        keywords: []
        params: [dlugosc_cm, waga_g]

  czekany:
    keywords: [czekan*, ice axe, ice tool*, dziab*]
    exclude: [oslon*, axe guard, ochraniacz*, smycz*, leash, pokrowiec*, kabur*]
    fallback: inne
    subcategories:
      turystyczne:
        keywords: [turyst*, lodowc*, glacier, raven, summit, alpin*, trekking*, air tech, neve, corsa,
                   g zero, g1, ghost, ortles]
        params: [dlugosc_cm, waga_g]
        alert_below: 300
      techniczne:
        keywords: [technicz*, do lodu, lodospad*, ice tool*, dziab*, nomic, ergo, quark, fuel, viper, x-dream, north machine, hybrid,
                   x monster, x-monster, adze, hammer]
        params: [waga_g, ksztalt_rekojesci]
      inne:
        # model bez jednoznacznego typu – widoczny w wynikach; typ rozstrzygnie strona produktu
        keywords: []
        params: [dlugosc_cm, waga_g]

  raki:
    keywords: [raki, rakow, crampon*]
    exclude: [raczki, raczek, nakladki antyposlizg*, but, buty, torb*, pokrowiec*, ochraniacz*, oslon*, antysniegow*]
    fallback: inne
    subcategories:
      polautomatyczne:
        keywords: [polautomat*, pol-automat*, pol automat*, semi-automatic, semiautomatic, semi, hybrid*, hybryd*, combi,
                   dual-matic, dualmatic, clip]
        params: [liczba_zebow, waga_g]
        alert_below: 450
      automatyczne:
        keywords: [automat*, automatic, step-in, stepin, auto, cramp-o-matic, new-matic, newmatic, leverlock]
        exclude: [polautomat*, pol-automat*, pol automat*, semi-automatic, semiautomatic, semi, dual-matic, dualmatic]
        params: [liczba_zebow, waga_g]
        wanted: false
      koszykowe:
        keywords: [koszyk*, basket, paskow*, flex*, universal, uniwersal*, classic, new-classic, strap, soft, walk]
        params: [liczba_zebow, waga_g]
        wanted: false
      inne:
        keywords: []
        params: [liczba_zebow, waga_g]

  palniki:
    keywords: [palnik*, kuchenk*, stove*]
    fallback: inne
    subcategories:
      x2_pro:
        keywords: [x2 pro, x2pro, x2-pro]
        brands: [Fire Maple]
        params: [waga_g, czas_gotowania_min]
      x1_pro:
        keywords: [x1 pro, x1pro, x1-pro]
        brands: [Fire Maple]
        params: [waga_g, czas_gotowania_min]
      x1:
        keywords: [x1]
        exclude: [x1 pro, x1pro, x1-pro]
        brands: [Fire Maple]
        params: [waga_g, czas_gotowania_min]
      inne:
        # pozostałe palniki (nie Fire Maple X1/X1 Pro/X2 Pro) – widoczne w wynikach
        keywords: []
        params: [waga_g, czas_gotowania_min]

  plecaki:
    keywords: [plecak*, backpack*]
    fallback: inne
    subcategories:
      duze:
        # duże męskie/unisex plecaki od 40 l (dowolna marka, np. Osprey Talon 44).
        # Klasyfikacja po pojemności z nazwy/specyfikacji; bez pojemności -> plecaki/inne.
        keywords: []
        param_range: {pojemnosc_l: {min: 40}}
        # płeć filtruje settings.gender (domyślnie męskie + unisex)
        brands: [Osprey]
        params: [pojemnosc_l, waga_g, rozmiar]
        alert_below: 600
      inne:
        keywords: []
        params: [pojemnosc_l, waga_g]
        wanted: false

  kurtki:
    keywords: [kurtk*, jacket*, anorak*]
    exclude_brands: [Decathlon, Quechua, Forclaz, Simond, Wedze]
    fallback: inne
    subcategories:
      hardshell:
        keywords: [hardshell*, hard shell, gore-tex, goretex, gtx, membran*, przeciwdeszcz*, nieprzemakal*, 3l, 2.5l, 2,5l, pertex shield, futurelight, h2no, dryvent, ascentshell, event]
        exclude: [softshell*, soft shell, puch*, down]
        season: całoroczna
        temp: [-20, 15]
        size: {labels: [M, L]}
        params: [waga_g, membrana, warstwy, wodoodpornosc_mm, sezon]
        alert_below: 900
      softshell:
        keywords: [softshell*, soft shell, windstopper*, schoeller*]
        require_name: true   # listing "softshell" zawiera też zwykłe spodnie/kurtki trekkingowe
        exclude: [hardshell*, hard shell]
        season: wiosna–jesień
        temp: [-10, 15]
        size: {labels: [M, L]}
        params: [waga_g, membrana, warstwy, wodoodpornosc_mm, sezon]
        alert_below: 500
      inne:
        keywords: []
        params: [waga_g]
        wanted: false

  spodnie:
    keywords: [spodni*, pants, trousers, bib*]
    exclude_brands: [Decathlon, Quechua, Forclaz, Simond, Wedze]
    fallback: inne
    subcategories:
      hardshell:
        keywords: [hardshell*, hard shell, gore-tex, goretex, gtx, membran*, przeciwdeszcz*, nieprzemakal*, 3l, 2.5l, 2,5l, futurelight, h2no, dryvent, ascentshell]
        exclude: [softshell*, soft shell]
        temp: [-20, 15]
        size: {labels: [M, L]}
        params: [waga_g, membrana, warstwy, wodoodpornosc_mm]
        alert_below: 700
      softshell:
        keywords: [softshell*, soft shell, windstopper*, schoeller*]
        require_name: true   # listing "softshell" zawiera też zwykłe spodnie/kurtki trekkingowe
        exclude: [hardshell*, hard shell]
        temp: [-10, 15]
        size: {labels: [M, L]}
        params: [waga_g, membrana, warstwy, wodoodpornosc_mm]
      inne:
        keywords: []
        params: [waga_g]
        wanted: false

  bluzy:
    keywords: [bluz*, hoody, hoodie, polar*, koszulk*, longsleeve, t-shirt, bielizn*, kurtka ocieplan*, ocieplacz*]
    exclude: [kurtk*, jacket*]   # "Kurtka ... hoody" to kurtka, nie bluza
    fallback: inne
    subcategories:
      syntetyczne:
        keywords: [syntet*, primaloft, polartec alpha, alpha, insulated, ocieplan*, coreloft, climashield, thermoball, ventrix, nano puff]
        exclude: [puch*, down, merino]
        size: {labels: [M, L]}
        params: [waga_g, sezon]
      merino:
        keywords: [merino, wel*, wool]
        size: {labels: [M, L]}
        params: [waga_g, sezon]
      inne:
        keywords: []
        params: [waga_g]
        wanted: false

  namioty:
    keywords: [namiot*, tent*, tarp*]
    fallback: inne
    subcategories:
      trzysezonowe:
        keywords: [3-sezon*, 3 sezon*, trzysezon*, 3-season, ultralight, ultralekk*, lekk*, trekking*]
        exclude: [4-sezon*, czterosezon*, zimow*, ekspedyc*]
        season: wiosna–jesień
        temp: [-5, 30]
        params: [waga_g, sezon]
      czterosezonowe:
        keywords: [4-sezon*, 4 sezon*, czterosezon*, 4-season, zimow*, ekspedyc*, wyprawow*]
        season: zima
        temp: [-30, 10]
        params: [waga_g, sezon]
        alert_below: 2500
      inne:
        keywords: []
        params: [waga_g]
        wanted: false

  spiwory:
    keywords: [spiwor*, sleeping bag*, quilt*]
    exclude: [wkladk*, liner*, dla psa, poduszk*, worek kompres*, pokrowiec*]
    fallback: inne
    subcategories:
      letnie:
        height_fit: spiwor
        keywords: [letni*, summer, ultralight]
        param_range: {temp_komfortu_c: {min: 5}}
        temp: [5, 30]
        params: [waga_g, temp_komfortu_c]
        wanted: false
      trzysezonowe:
        height_fit: spiwor
        keywords: [3-sezon*, trzysezon*, 3-season]
        param_range: {temp_komfortu_c: {min: -4.9, max: 4.9}}
        temp: [-5, 10]
        params: [waga_g, temp_komfortu_c]
      zimowe:
        height_fit: spiwor
        keywords: [zimow*, ekspedyc*, winter, wyprawow*]
        param_range: {temp_komfortu_c: {max: -5}}
        temp: [-40, -5]
        params: [waga_g, temp_komfortu_c]
        alert_below: 1500
      inne:
        # temperatura nieznana (brak w nazwie) – widoczny; sezon ustali strona produktu
        height_fit: spiwor
        keywords: []
        params: [waga_g, temp_komfortu_c]

  karimaty:
    keywords: [karimat*, mata samopomp*, materac*, podkladk*, sleeping pad*, pad]
    exclude: [crash*, materac dmuchany do basenu, pompk*, poduszk*, lata*, zestaw naprawczy]
    fallback: inne
    subcategories:
      letnie:
        height_fit: karimata
        param_range: {r_value: {max: 1.99}}
        keywords: [letni*, summer]
        params: [waga_g, r_value]
        wanted: false
      trzysezonowe:
        height_fit: karimata
        param_range: {r_value: {min: 2, max: 3.99}}
        keywords: [3-sezon*, trzysezon*]
        params: [waga_g, r_value]
      zimowe:
        height_fit: karimata
        param_range: {r_value: {min: 4}}
        keywords: [zimow*, winter, xtherm]
        params: [waga_g, r_value]
        alert_below: 700
      inne:
        # R-value nieznane – widoczny; R ustali strona produktu
        height_fit: karimata
        keywords: []
        params: [waga_g, r_value]

  buty:
    keywords: [but, buty, butow, obuwie, boot, boots, trzewik*]
    fallback: inne
    subcategories:
      b2:
        keywords: [b2, wysokogorsk*, gorskie, alpin*, nepal, trango, aequilibrium, g5, mountain pro, pod raki, rapace]
        exclude: [b3, b1, podejsciow*]
        size: {min: 45.5, max: 46.5}
        params: [waga_g, rozmiary]
        alert_below: 1200
      inne:
        keywords: []
        params: [rozmiary]
        wanted: false

  przewodniki:
    keywords: [przewodnik*, topo wspinacz*, topos, guidebook*, guide book]
    fallback: inne
    subcategories:
      sokoliki:
        keywords: [sokolik*, rudawy janowickie]
        params: []
      klodzko:
        keywords: [klodz*, kotlina klodzka, ziemia klodzka, szczeliniec]
        params: []
      inne:
        keywords: []
        params: []
        wanted: false

  pozostale:
    subcategories:
      crashpad:
        keywords: [crash*, crash pad, crashpad*, bouldering pad]
        params: [waga_g]
        alert_below: 600
      czapka:
        keywords: [czapk*, beanie*, toque]
        brands: [Mammut, Arc'teryx]
        require_brand: true
        params: []
