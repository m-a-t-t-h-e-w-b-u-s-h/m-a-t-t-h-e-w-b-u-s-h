# Znane modele – rozstrzygają podkategorię (i opcjonalnie parametry), gdy nazwa w sklepie
# jest skąpa, np. Skalnik: "Buty ribelle hd-tonic", "Kurtka triolet-black".
#
#   model:  słowa z nazwy (bez polskich znaków i wielkości liter; "*" = prefiks)
#   brand:  wymagana marka (w nazwie, marce produktu lub adresie) – przy modelach
#           o pospolitych nazwach (Beta, Alpha, Spirit…), żeby nie łapać innych rzeczy
#   sub:    podkategoria (albo lista – bierze pierwszą istniejącą w kategorii produktu,
#           np. [ekspresowe, sportowe]: karabinek -> karabinki/ekspresowe, ekspres -> ekspresy/sportowe)
#   params: parametry ustawiane, gdy sklep ich nie podaje (specyfikacja ze strony ma pierwszeństwo)
#
# Kategorię produktu nadal wyznaczają reguły z wishlist.yaml (np. "Kurtka" / "Spodnie"),
# więc wpis "nordwand" zadziała i dla kurtki, i dla spodni.
# Pierwszy pasujący wpis wygrywa – bardziej szczegółowe modele wpisuj wyżej (np. "nepal cube" przed "nepal").
#
# UWAGA: wpisane z pamięci (bez dostępu do stron producentów), tylko modele, przy których
# przypisanie jest dość pewne. Producenci zmieniają konstrukcje między wersjami – jeśli coś się
# nie zgadza z opisem w sklepie, popraw albo usuń wpis. Liczb łatwych do pomylenia
# (temperatury komfortu, wagi, czasy gotowania) celowo tu nie ma.

